<!doctype html>
<html lang="en" style="color-scheme: dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>live-diff</title>
  <style>
    :root {
      --bg: #0d1117; --bg-soft: #161b22; --bg-soft2: #1c232c;
      --border: #30363d; --text: #c9d1d9; --text-dim: #8b949e;
      --green: #3fb950; --red: #f85149; --accent: #58a6ff;
      --staged: #d29922;
      --filter-h: 47px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Noto Sans, Helvetica, Arial, sans-serif;
      font-size: 13px; line-height: 1.45;
      display: flex; flex-direction: column; overflow: hidden;
    }
    header {
      flex: 0 0 auto; height: 50px; display: flex; align-items: center; gap: 14px; padding: 0 14px;
      background: rgba(13,17,23,.9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
    }
    .title { font-weight: 600; font-size: 14px; white-space: nowrap; }
    .title small { color: var(--text-dim); font-weight: 400; margin-left: 6px; }
    .live { display: inline-flex; align-items: center; gap: 6px; color: var(--text-dim); font-size: 12px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); }
    .live.on .dot { background: var(--green); animation: pulse 2s infinite; }
    @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(63,185,80,.55)} 70%{box-shadow:0 0 0 7px rgba(63,185,80,0)} 100%{box-shadow:0 0 0 0 rgba(63,185,80,0)} }
    .stats { display: inline-flex; gap: 12px; font-variant-numeric: tabular-nums; }
    .stats .add { color: var(--green); } .stats .del { color: var(--red); } .stats .files { color: var(--text-dim); }
    .spacer { flex: 1; }
    .stamp { color: var(--text-dim); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }

    .app { flex: 1; display: flex; min-height: 0; }
    .sidebar { width: 350px; flex: 0 0 auto; overflow-y: auto; background: var(--bg); border-right: 1px solid var(--border); }
    .filter-bar {
      position: sticky; top: 0; z-index: 5; height: var(--filter-h);
      display: flex; align-items: center; padding: 0 8px;
      background: var(--bg); border-bottom: 1px solid var(--border);
    }
    .filter-bar input {
      width: 100%; padding: 6px 10px; background: var(--bg-soft); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px; font-size: 12px; outline: none;
    }
    .filter-bar input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88,166,255,.25); }
    .main { flex: 1; position: relative; min-width: 0; }
    #diff { position: absolute; inset: 0; }
    .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-size: 14px; pointer-events: none; text-align: center; padding: 20px; }
    .overlay .big { font-size: 40px; display: block; margin-bottom: 8px; opacity: .4; }
    #code { position: absolute; inset: 0; display: none; }
    .codebar {
      position: absolute; top: 8px; right: 12px; z-index: 6; display: none; align-items: center; gap: 10px;
      background: var(--bg-soft); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px 4px 4px; font-size: 12px;
      max-width: 60%; box-shadow: 0 2px 8px rgba(0,0,0,.35);
    }
    .codebar button { background: var(--bg-soft2); color: var(--text); border: 1px solid var(--border); border-radius: 5px; padding: 3px 8px; cursor: pointer; font-size: 12px; white-space: nowrap; }
    .codebar button:hover { border-color: var(--accent); color: var(--accent); }
    .codebar .code-title { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
    .toast {
      position: absolute; bottom: 14px; right: 14px; z-index: 7; max-width: 70%;
      background: var(--bg-soft2); border: 1px solid var(--border); color: var(--text);
      padding: 6px 12px; border-radius: 6px; font-size: 12px;
      opacity: 0; transition: opacity .2s; pointer-events: none;
    }
    .toast.show { opacity: 1; }

    .section { border-bottom: 1px solid var(--border); }
    .section-head {
      display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer; user-select: none;
      position: sticky; top: var(--filter-h); background: var(--bg); z-index: 2;
    }
    .section-head:hover { background: var(--bg-soft); }
    .section-head .label { font-size: 12px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; }
    .section.staged .label { color: var(--staged); }
    .section.unstaged .label { color: var(--text-dim); }
    .section-head .count { color: var(--text-dim); font-size: 11px; font-variant-numeric: tabular-nums; }
    .section-head .acts { margin-left: auto; display: flex; gap: 8px; font-size: 11px; }
    .section-head .acts a { color: var(--text-dim); cursor: pointer; }
    .section-head .acts a:hover { color: var(--accent); }
    .section-head .caret { color: var(--text-dim); transition: transform .12s; width: 12px; }
    .section.collapsed .section-tree { display: none; }
    .section.collapsed .caret { transform: rotate(-90deg); }
    .section-tree { padding: 2px 6px 12px; }

    .empty-section { padding: 8px 12px 14px; color: var(--text-dim); font-size: 12px; font-style: italic; }

    .tree { font-size: 12.5px; }
    .folder > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 3px 6px; border-radius: 5px; white-space: nowrap; }
    .folder > summary::-webkit-details-marker { display: none; }
    .folder > summary:hover { background: var(--bg-soft); }
    .caret { width: 12px; display: inline-block; color: var(--text-dim); transition: transform .12s; }
    .folder[open] > summary .caret { transform: rotate(90deg); }
    .fname { overflow: hidden; text-overflow: ellipsis; }
    .folder .fname { color: var(--text-dim); font-weight: 500; }
    .badge { margin-left: auto; padding-left: 8px; font-variant-numeric: tabular-nums; font-size: 11px; white-space: nowrap; }
    .badge .add { color: var(--green); } .badge .del { color: var(--red); margin-left: 6px; }
    .badge .muted { color: var(--text-dim); opacity: .5; }
    .folder-children { padding-left: 14px; }
    .file { cursor: pointer; display: flex; align-items: center; gap: 5px; padding: 3px 6px 3px 6px; border-radius: 5px; white-space: nowrap; }
    .file:hover { background: var(--bg-soft); }
    .file.active { background: rgba(88,166,255,.16); box-shadow: inset 2px 0 0 var(--accent); }
    .file .fname.added { color: var(--green); }
    .file .fname.deleted { color: var(--red); }
    .cb { margin: 0; cursor: pointer; accent-color: var(--green); flex: 0 0 auto; }
    .cb:disabled { cursor: progress; }

    /* history (last 20 commits) */
    .commit-list { font-size: 12.5px; }
    .commit { cursor: pointer; padding: 4px 6px; border-radius: 5px; }
    .commit:hover { background: var(--bg-soft); }
    .commit.active { background: rgba(88,166,255,.16); box-shadow: inset 2px 0 0 var(--accent); }
    .commit .row1 { display: flex; align-items: baseline; gap: 6px; }
    .commit .subj { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .commit .mrg { color: var(--text-dim); font-size: 10px; border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; flex: 0 0 auto; }
    .commit .meta { display: flex; align-items: baseline; gap: 8px; color: var(--text-dim); font-size: 11px; margin-top: 1px; }
    .commit .meta .sha { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--accent); opacity: .85; }
    .commit .meta .when { font-variant-numeric: tabular-nums; }

    /* commit patch view (main area) */
    #commit { position: absolute; inset: 0; display: none; }
    .commitbar {
      position: absolute; top: 8px; right: 12px; z-index: 6; display: none; align-items: center; gap: 10px;
      background: var(--bg-soft); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px 4px 4px; font-size: 12px;
      max-width: 75%; box-shadow: 0 2px 8px rgba(0,0,0,.35);
    }
    .commitbar button { background: var(--bg-soft2); color: var(--text); border: 1px solid var(--border); border-radius: 5px; padding: 3px 8px; cursor: pointer; font-size: 12px; white-space: nowrap; }
    .commitbar button:hover { border-color: var(--accent); color: var(--accent); }
    .commit-title { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .commit-title .sha { color: var(--accent); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    /* unified-diff line coloring for the commit patch view */
    .ld-add { background: rgba(63,185,80,.14); }
    .ld-del { background: rgba(248,81,73,.14); }
    .ld-hunk { background: rgba(88,166,255,.10); }
    .ld-meta { color: var(--text-dim); }
    .ld-fname { color: var(--text); font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <span class="title"><span id="repo-name">…</span> <small>· live diff</small></span>
    <span class="live" id="live"><span class="dot"></span><span id="livetxt">connecting…</span></span>
    <span class="stats">
      <span class="files" id="s-files">—</span>
      <span class="add" id="s-add"></span>
      <span class="del" id="s-del"></span>
    </span>
    <span class="spacer"></span>
    <span class="stamp" id="stamp"></span>
  </header>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="filter-bar">
        <input id="filter" type="search" placeholder="Filter files…  (press /)">
      </div>
      <div class="section staged" id="sec-staged">
        <div class="section-head">
          <span class="caret">▾</span><span class="label">Staged</span><span class="count" id="cnt-staged"></span>
          <span class="acts"><a class="fold-all">collapse</a></span>
        </div>
        <div class="section-tree"><div class="tree" id="tree-staged"></div></div>
      </div>
      <div class="section unstaged" id="sec-unstaged">
        <div class="section-head">
          <span class="caret">▾</span><span class="label">Unstaged</span><span class="count" id="cnt-unstaged"></span>
          <span class="acts"><a class="fold-all">collapse</a></span>
        </div>
        <div class="section-tree"><div class="tree" id="tree-unstaged"></div></div>
      </div>
      <div class="section history" id="sec-history">
        <div class="section-head">
          <span class="caret">▾</span><span class="label">History</span><span class="count" id="cnt-history"></span>
        </div>
        <div class="section-tree"><div class="commit-list" id="commit-list"></div></div>
      </div>
    </aside>
    <main class="main">
      <div id="diff"></div>
      <div id="commit"></div>
      <div id="code"></div>
      <div class="codebar" id="codebar">
        <button id="back-btn" title="Back to the diff view">‹ back to diff</button>
        <span class="code-title" id="code-title"></span>
      </div>
      <div class="commitbar" id="commitbar">
        <button id="commit-back-btn" title="Back to the diff view">‹ back to diff</button>
        <span class="commit-title" id="commit-title"></span>
      </div>
      <div class="toast" id="toast"></div>
      <div class="overlay" id="overlay"><span class="big">‹/›</span>Select a file to view its diff.</div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
  <script>
    const CDN = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/';
    window.MonacoEnvironment = {
      getWorkerUrl: () => `data:text/javascript;charset=utf-8,${encodeURIComponent(
        `self.MonacoEnvironment={baseUrl:'${CDN}'};importScripts('${CDN}vs/base/worker/workerMain.js');`)}`,
    };

    const diffEl = document.getElementById('diff'), overlay = document.getElementById('overlay');
    const codeEl = document.getElementById('code'), codebar = document.getElementById('codebar');
    const codeTitle = document.getElementById('code-title'), backBtn = document.getElementById('back-btn');
    const toastEl = document.getElementById('toast');
    const treeStaged = document.getElementById('tree-staged'), treeUnstaged = document.getElementById('tree-unstaged');
    const cntStaged = document.getElementById('cnt-staged'), cntUnstaged = document.getElementById('cnt-unstaged');
    const liveEl = document.getElementById('live'), liveTxt = document.getElementById('livetxt');
    const sFiles = document.getElementById('s-files'), sAdd = document.getElementById('s-add'), sDel = document.getElementById('s-del');
    const stamp = document.getElementById('stamp'), filterInput = document.getElementById('filter');
    const commitListEl = document.getElementById('commit-list'), cntHistory = document.getElementById('cnt-history');
    const commitEl = document.getElementById('commit'), commitbar = document.getElementById('commitbar');
    const commitTitle = document.getElementById('commit-title'), commitBackBtn = document.getElementById('commit-back-btn');

    let monacoReady = null, diffEditor = null, currentModels = null;
    let currentPath = null, currentSide = null, currentSig = '';
    let lastSig = null, lastData = null, currentFilter = '';
    let codeEditor = null, rawPath = null;
    const rawModels = new Map(); // path -> monaco model (read-only file viewer, small LRU)
    let commitEditor = null, commitModel = null, commitDecor = null, openSha = null, openSubject = '';
    let shownCommits = null, shownKey = '';

    function loadMonaco() {
      if (monacoReady) return monacoReady;
      monacoReady = new Promise((resolve) => {
        require.config({ paths: { vs: CDN + 'vs' } });
        require(['vs/editor/editor.main'], () => { monaco.editor.setTheme('vs-dark'); resolve(window.monaco); });
      });
      return monacoReady;
    }
    function ensureEditor(mono) {
      if (diffEditor) return diffEditor;
      diffEditor = mono.editor.createDiffEditor(diffEl, {
        readOnly: true, renderSideBySide: false, automaticLayout: true,
        minimap: { enabled: true }, scrollBeyondLastLine: false, renderWhitespace: 'selection',
      });
      hookNav(diffEditor.getModifiedEditor());
      hookNav(diffEditor.getOriginalEditor());
      return diffEditor;
    }
    function showOverlay(msg) { overlay.innerHTML = `<span class="big">‹/›</span>${msg}`; overlay.style.display = 'flex'; }
    function hideOverlay() { overlay.style.display = 'none'; }
    function sig(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return h; }

    /* ---------------- go to definition (heuristic, all languages) ---------------- */
    function toast(msg, ms = 2500) {
      toastEl.textContent = msg; toastEl.classList.add('show');
      clearTimeout(toast._t); toast._t = setTimeout(() => toastEl.classList.remove('show'), ms);
    }
    const KEYWORDS = /^(function|fn|func|def|class|interface|trait|enum|struct|impl|type|namespace|module|package|sub|proc|const|let|var|new|return|import|export|from|require|this|self|super|if|else|for|while|switch|case|try|catch|finally|throw|true|false|null|undefined|none|void|int|str|string|number|bool|public|private|protected|static|async|await|yield|use)$/i;

    function rankDefs(matches, word, srcPath) {
      const e = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const decl = new RegExp(
        '(function|fn|func|def|class|interface|trait|enum|struct|impl|type|namespace|module|sub|proc|package)\\s+' + e + '\\b' +
        '|\\b(const|let|var)\\s+' + e + '\\b' +
        '|\\b' + e + '\\s*[:=]\\s*(async\\s+)?(function|\\()', 'i');
      return matches
        .map(m => ({ m, s: (decl.test(m.text) ? 10 : 0) + (m.path === srcPath ? 2 : 0) - Math.min((m.path.split('/').length - 1), 5) * 0.1 }))
        .sort((a, b) => b.s - a.s)
        .map(x => x.m);
    }

    async function tryGoto(editor, pos) {
      const model = editor.getModel();
      if (!model || !pos) return;
      const w = model.getWordAtPosition(pos);
      if (!w || !w.word || w.word.length < 2 || KEYWORDS.test(w.word)) return;
      const word = w.word;
      if (!/^[\p{L}\p{N}_$]+$/u.test(word)) { toast('"' + word + '" is not a searchable identifier'); return; }
      toast('searching "' + word + '"…', 8000);
      try {
        const r = await fetch('api/symbol?q=' + encodeURIComponent(word), { cache: 'no-store' });
        if (!r.ok) {
          // A 404 here means the RUNNING server predates api/symbol (stale
          // process / separate install) — its body is plain text, not JSON.
          toast(r.status === 404
            ? 'Server does not support symbol search — update + restart live-diff'
            : 'Symbol search failed (HTTP ' + r.status + ')', 5000);
          return;
        }
        const d = await r.json();
        const src = rawPath || currentPath;
        const hits = rankDefs(d.matches || [], word, src);
        if (!hits.length) { toast('No definition found for "' + word + '"'); return; }
        const h = hits[0];
        if (h.path === src) { // same file -> reveal in place
          const ed = rawPath ? codeEditor : (diffEditor && diffEditor.getModifiedEditor());
          if (ed) {
            ed.revealLineInCenter(h.line); ed.setPosition({ lineNumber: h.line, column: 1 }); ed.focus();
            toast(hits.length > 1 ? hits.length + ' matches — jumped to best' : '', 1500);
            return;
          }
        }
        if (hits.length > 1) toast('Jumped to best of ' + hits.length + ' matches for "' + word + '"');
        openRaw(h.path, h.line);
      } catch (e) { toast('Symbol search failed'); }
    }

    function hookNav(editor) {
      editor.addAction({
        id: 'live-diff.goto-def', label: 'Go to Definition',
        contextMenuGroupId: 'navigation', contextMenuOrder: 0,
        keybindings: [monaco.KeyCode.F12],
        run: (ed) => { const p = ed.getPosition(); if (p) tryGoto(ed, p); },
      });
      editor.onMouseDown((ev) => {
        if ((ev.event.ctrlKey || ev.event.metaKey) && ev.target && ev.target.position) tryGoto(editor, ev.target.position);
      });
    }

    // The main area shows exactly one of: the diff editor, the commit patch view,
    // or the raw file viewer.
    function showMain(which) {
      diffEl.style.display = which === 'diff' ? 'block' : 'none';
      commitEl.style.display = which === 'commit' ? 'block' : 'none';
      codeEl.style.display = which === 'raw' ? 'block' : 'none';
      codebar.style.display = which === 'raw' ? 'flex' : 'none';
      commitbar.style.display = which === 'commit' ? 'flex' : 'none';
    }

    async function openRaw(path, line) {
      try {
        const r = await fetch('api/raw?path=' + encodeURIComponent(path), { cache: 'no-store' });
        if (!r.ok) throw new Error(r.status);
        const d = await r.json();
        if (d.binary) { toast('Binary file'); return; }
        if (d.content == null) { toast('Not found: ' + path); return; }
        const mono = await loadMonaco(); hideOverlay();
        if (!codeEditor) {
          codeEditor = mono.editor.create(codeEl, {
            readOnly: true, automaticLayout: true, minimap: { enabled: true },
            scrollBeyondLastLine: false, renderWhitespace: 'selection',
          });
          hookNav(codeEditor);
        }
        let m = rawModels.get(path);
        if (!m) {
          m = mono.editor.createModel(d.content || '', d.language);
          rawModels.set(path, m);
          if (rawModels.size > 30) { const k = rawModels.keys().next().value; const old = rawModels.get(k); rawModels.delete(k); if (old) old.dispose(); }
        } else {
          rawModels.delete(path); rawModels.set(path, m); // LRU refresh
          if (m.getValue() !== (d.content || '')) m.setValue(d.content || '');
        }
        codeEditor.setModel(m);
        showMain('raw'); codeTitle.textContent = path;
        rawPath = path;
        codeEditor.revealLineInCenter(line);
        codeEditor.setPosition({ lineNumber: line, column: 1 });
        codeEditor.focus();
      } catch (e) { toast('Failed to open ' + path); }
    }
    function backToDiff() {
      if (rawPath == null) return;
      rawPath = null;
      if (codeEditor) codeEditor.setModel(null);
      // return to the commit patch view if one is open, else the diff editor
      showMain(openSha ? 'commit' : 'diff');
      if (openSha && commitEditor) commitEditor.focus();
      else if (diffEditor && diffEditor.getModifiedEditor) diffEditor.getModifiedEditor().focus();
    }
    backBtn.addEventListener('click', backToDiff);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && rawPath != null && document.activeElement !== filterInput) backToDiff();
      else if (e.key === 'Escape' && openSha && document.activeElement !== filterInput) closeCommit();
    });

    /* ---------------- commit history (last 20 commits) ---------------- */
    function relTime(iso) {
      const t = Date.parse(iso);
      if (isNaN(t)) return '';
      const s = Math.max(0, (Date.now() - t) / 1000);
      if (s < 60) return 'just now';
      const m = s / 60, h = m / 60, d = h / 24;
      if (m < 60) return Math.floor(m) + 'm ago';
      if (h < 24) return Math.floor(h) + 'h ago';
      if (d < 30) return Math.floor(d) + 'd ago';
      if (d < 365) return Math.floor(d / 30) + 'mo ago';
      return Math.floor(d / 365) + 'y ago';
    }
    function renderHistory(commits) {
      const key = commits.map(c => c.sha).join(',');
      if (key === shownKey) return; // unchanged since last render
      shownKey = key; shownCommits = commits;
      cntHistory.textContent = commits.length ? String(commits.length) : '';
      commitListEl.innerHTML = '';
      if (!commits.length) { commitListEl.innerHTML = '<div class="empty-section">No commits yet.</div>'; return; }
      for (const c of commits) {
        const div = document.createElement('div');
        div.className = 'commit' + (c.sha === openSha ? ' active' : '');
        div.dataset.sha = c.sha;
        const merge = c.parents && c.parents.length > 1;
        const when = relTime(c.date);
        const title = c.subject + '\n' + c.author + (c.date ? ' · ' + new Date(c.date).toLocaleString() : '');
        const tag = merge ? '<span class="mrg">merge</span>'
          : (c.binary && !c.add && !c.del ? '<span class="badge"><span class="muted">bin</span></span>' : badge(c.add, c.del));
        div.innerHTML = `<div class="row1"><span class="subj" title="${esc(title)}">${esc(c.subject)}</span>${tag}</div>` +
          `<div class="meta"><span class="sha">${esc(c.short)}</span><span>${esc(c.author)}</span>${when ? `<span class="when" title="${esc(c.date)}">${when}</span>` : ''}</div>`;
        div.addEventListener('click', () => openCommit(c.sha, div));
        commitListEl.appendChild(div);
      }
    }
    async function loadHistory() {
      try {
        const r = await fetch('api/commits', { cache: 'no-store' });
        if (r.status === 404) { // stale server process predating api/commits
          document.getElementById('sec-history').style.display = 'none';
          return;
        }
        if (!r.ok) return;
        const d = await r.json();
        renderHistory(d.commits || []);
      } catch (e) {}
    }

    // Color the unified-diff lines of the commit patch view.
    function decoratePatch(editor, model, text) {
      if (commitDecor) { commitDecor.clear(); commitDecor = null; }
      const lines = text.split('\n');
      if (lines.length > 25000) return; // huge patch: skip per-line coloring
      const decor = [];
      for (let i = 0; i < lines.length; i++) {
        const l = lines[i];
        let cls = null;
        if (/^diff --git /.test(l)) cls = 'ld-fname';
        else if (/^(index |old mode |new mode |deleted file mode |new file mode |copy from |copy to |rename from |rename to |similarity index |dissimilarity index |--- |\+\+\+ )/.test(l)) cls = 'ld-meta';
        else if (l.startsWith('@@')) cls = 'ld-hunk';
        else if (l.startsWith('+')) cls = 'ld-add';
        else if (l.startsWith('-')) cls = 'ld-del';
        if (cls) decor.push({ range: new monaco.Range(i + 1, 1, i + 1, 1), options: { isWholeLine: true, className: cls } });
      }
      if (decor.length && editor.createDecorationsCollection) {
        commitDecor = editor.createDecorationsCollection(decor);
      }
    }
    async function openCommit(sha, node) {
      if (rawPath != null) backToDiff();
      document.querySelectorAll('.commit.active').forEach(n => n.classList.remove('active'));
      if (node) node.classList.add('active');
      showOverlay('Loading commit…');
      try {
        const r = await fetch('api/commit?sha=' + encodeURIComponent(sha), { cache: 'no-store' });
        if (!r.ok) throw new Error(r.status);
        const d = await r.json();
        const c = (shownCommits || []).find(x => x.sha === sha);
        const subj = c ? c.subject : sha.slice(0, 8);
        if (!d.patch || !d.patch.trim()) {
          showMain('diff'); // close any previously open patch view
          openSha = sha; openSubject = subj;
          showOverlay('No textual changes in this commit.');
          return;
        }
        const mono = await loadMonaco(); hideOverlay();
        if (!commitEditor) {
          commitEditor = mono.editor.create(commitEl, {
            readOnly: true, automaticLayout: true, minimap: { enabled: true },
            scrollBeyondLastLine: false, renderWhitespace: 'selection', guides: { indentation: false },
          });
          hookNav(commitEditor);
        }
        if (commitModel) commitModel.dispose();
        commitModel = mono.editor.createModel(d.patch, 'plaintext');
        commitEditor.setModel(commitModel);
        decoratePatch(commitEditor, commitModel, d.patch);
        showMain('commit');
        commitTitle.innerHTML = `<span class="sha">${esc(sha.slice(0, 8))}</span> ${esc(subj)}`;
        openSha = sha; openSubject = subj;
        commitEditor.setScrollTop(0);
      } catch (e) {
        showOverlay('Failed to load commit.');
      }
    }
    function closeCommit() {
      if (!openSha) return;
      openSha = null; openSubject = '';
      document.querySelectorAll('.commit.active').forEach(n => n.classList.remove('active'));
      if (commitDecor) { commitDecor.clear(); commitDecor = null; }
      if (commitModel) { commitModel.dispose(); commitModel = null; }
      if (commitEditor) commitEditor.setModel(null);
      showMain('diff');
    }
    commitBackBtn.addEventListener('click', closeCommit);

    async function loadFile(path, side, node) {
      if (rawPath != null) backToDiff();
      if (openSha) closeCommit();
      document.querySelectorAll('.file.active').forEach(n => n.classList.remove('active'));
      if (node) node.classList.add('active');
      showOverlay('Loading…');
      try {
        const r = await fetch('api/file?path=' + encodeURIComponent(path) + '&side=' + side);
        if (!r.ok) throw new Error(r.status);
        const data = await r.json();
        if (data.binary) { showOverlay('Binary file — no textual diff'); return; }
        const s = sig(data.before) + ':' + sig(data.after);
        const mono = await loadMonaco(); hideOverlay(); ensureEditor(mono);
        if (currentModels) { currentModels.original.dispose(); currentModels.modified.dispose(); }
        currentModels = {
          original: mono.editor.createModel(data.before || '', data.language),
          modified: mono.editor.createModel(data.after || '', data.language),
        };
        diffEditor.setModel(currentModels);
        currentPath = path; currentSide = side; currentSig = s;
      } catch (e) { showOverlay('Failed to load: ' + path); }
    }

    async function toggleStage(path, side, cb) {
      const endpoint = side === 'unstaged' ? 'api/stage' : 'api/unstage';
      cb.disabled = true;
      try { await fetch(endpoint + '?path=' + encodeURIComponent(path), { method: 'POST' }); }
      catch (e) { cb.disabled = false; }
      // server recomputes + notifies -> refresh() re-renders the trees.
    }

    /* ---------------- diff parsing + tree ---------------- */
    // Git C-quotes paths containing non-ASCII/special chars ("a/caf\303\251.dart");
    // plain spaces stay BARE (a/My File.pdf b/My File.pdf) — both must parse,
    // or the file shows up as a bogus "unknown" entry.
    function unquoteQ(body) { // decode the INSIDE of a C-quoted path (no quotes)
      if (body.indexOf('\\') === -1) return body;
      const bytes = [], enc = new TextEncoder();
      const esc = { n: 10, t: 9, r: 13, a: 7, b: 8, f: 12, v: 11 };
      for (let i = 0; i < body.length; ) {
        const c = body[i];
        if (c === '\\' && i + 1 < body.length) {
          const n = body[i + 1];
          if (n >= '0' && n <= '7') { // octal byte(s) — consecutive ones form multi-byte UTF-8
            let o = 0, j = i + 1, k = 0;
            while (j < body.length && k < 3 && body[j] >= '0' && body[j] <= '7') { o = o * 8 + +body[j]; j++; k++; }
            bytes.push(o); i = j;
          } else { bytes.push(n in esc ? esc[n] : n.charCodeAt(0)); i += 2; }
        } else { bytes.push(...enc.encode(c)); i++; }
      }
      return new TextDecoder().decode(Uint8Array.from(bytes));
    }
    function unquoteGitPath(s) { return s.charCodeAt(0) === 34 ? unquoteQ(s.slice(1, -1)) : s; }
    // Extract the NEW path from a `diff --git a/<old> b/<new>` header line
    // (the prefix may or may not still be attached, depending on the splitter).
    function headerPath(line) {
      line = line.replace(/^diff --git /, '');
      let m;
      if ((m = line.match(/ "b\/((?:[^"\\]|\\.)*)"$/))) return unquoteQ(m[1]); // new side quoted
      if ((m = line.match(/^"a\/(?:[^"\\]|\\.)*" b\/(.+)$/))) return m[1];     // old quoted, new bare
      if ((m = line.match(/^a\/\S+ b\/(.+)$/))) return m[1];                    // both bare, old w/o spaces
      const i = line.indexOf(' b/');                                          // both bare, spaces in path
      return i > 2 ? line.slice(i + 3) : null;
    }
    function parseFiles(diff) {
      if (!diff) return [];
      const blocks = diff.split(/^diff --git /m); const out = [];
      for (let bi = 1; bi < blocks.length; bi++) {
        const block = blocks[bi];
        let p = headerPath(block.split('\n', 1)[0]) || 'unknown';
        const rt = block.match(/^rename to (.+)$/m); if (rt) p = unquoteGitPath(rt[1].trim());
        let status = 'modified';
        if (/^new file mode/.test(block)) status = 'added';
        else if (/^deleted file mode/.test(block)) status = 'deleted';
        else if (/^rename (from|to) /.test(block)) status = 'renamed';
        const add = (block.match(/^\+[^+]/gm) || []).length;
        const del = (block.match(/^-[^-]/gm) || []).length;
        out.push({ path: p, add, del, status, idx: out.length });
      }
      return out;
    }
    function buildModel(files) {
      const root = { dirs: {}, files: [] };
      for (const f of files) {
        const parts = f.path.split('/'); let node = root;
        for (let i = 0; i < parts.length; i++) {
          if (i === parts.length - 1) node.files.push(f);
          else { const seg = parts[i]; if (!node.dirs[seg]) node.dirs[seg] = { name: seg, dirs: {}, files: [] }; node = node.dirs[seg]; }
        }
      }
      return root;
    }
    function subtreeStats(dir) {
      let add = 0, del = 0, count = 0;
      for (const f of dir.files) { add += f.add; del += f.del; count++; }
      for (const k of Object.keys(dir.dirs)) { const s = subtreeStats(dir.dirs[k]); add += s.add; del += s.del; count += s.count; }
      return { add, del, count };
    }
    function esc(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function badge(add, del) {
      if (!add && !del) return '<span class="badge"><span class="muted">·</span></span>';
      return `<span class="badge"><span class="add">+${add}</span><span class="del">−${del}</span></span>`;
    }
    function renderSection(side, files, container) {
      container.innerHTML = '';
      if (!files.length) { container.innerHTML = '<div class="empty-section">Nothing here.</div>'; return; }
      renderDir(buildModel(files), container, side);
      // re-apply active highlight if the open file is in this section
      if (currentSide === side && currentPath) {
        const n = container.querySelector(`.file[data-path="${cssEsc(currentPath)}"][data-side="${side}"]`);
        if (n) n.classList.add('active');
      }
    }
    function cssEsc(s) { return s.replace(/["\\]/g, '\\$&'); }
    function renderDir(dir, container, side) {
      for (const key of Object.keys(dir.dirs).sort()) {
        let child = dir.dirs[key]; let name = child.name;
        while (Object.keys(child.dirs).length === 1 && child.files.length === 0) {
          const onlyKey = Object.keys(child.dirs)[0]; child = child.dirs[onlyKey]; name += '/' + child.name;
        }
        const det = document.createElement('details'); det.open = true; det.className = 'folder';
        const s = subtreeStats(child);
        det.innerHTML = `<summary><span class="caret">▸</span><span class="fname">${esc(name)}</span>${badge(s.add, s.del)}</summary>`;
        const inner = document.createElement('div'); inner.className = 'folder-children';
        renderDir(child, inner, side); det.appendChild(inner); container.appendChild(det);
      }
      for (const f of dir.files) {
        const div = document.createElement('div'); div.className = 'file'; div.dataset.path = f.path; div.dataset.side = side;
        const cb = document.createElement('input'); cb.type = 'checkbox'; cb.className = 'cb';
        cb.checked = side === 'staged'; cb.title = side === 'staged' ? 'Unstage' : 'Stage';
        cb.addEventListener('click', (e) => e.stopPropagation());
        cb.addEventListener('change', () => toggleStage(f.path, side, cb));
        div.appendChild(cb);
        const base = f.path.split('/').pop();
        const cls = f.status === 'added' ? 'added' : f.status === 'deleted' ? 'deleted' : '';
        div.insertAdjacentHTML('beforeend', `<span class="fname ${cls}" title="${esc(f.path)}">${esc(base)}</span>${badge(f.add, f.del)}`);
        div.addEventListener('click', () => loadFile(f.path, side, div));
        container.appendChild(div);
      }
    }
    function filterDiff(raw, q) {
      if (!q) return raw;
      const blocks = raw.split(/(?=^diff --git )/m);
      const ql = q.toLowerCase();
      // Match the file PATH only, not the diff body — otherwise a query like
      // "grid." would match every file whose diffed code mentions "grid.".
      return blocks.filter(b => {
        const path = headerPath(b.split('\n', 1)[0]) || '';
        return path.toLowerCase().includes(ql);
      }).join('');
    }
    function updateStats(sf, uf) {
      let a = 0, d = 0; for (const f of sf) { a += f.add; d += f.del; } for (const f of uf) { a += f.add; d += f.del; }
      const n = sf.length + uf.length;
      sFiles.textContent = n + (n === 1 ? ' file' : ' files'); sAdd.textContent = '+' + a; sDel.textContent = '−' + d;
      cntStaged.textContent = sf.length ? `${sf.length} · +${sf.reduce((x, f) => x + f.add, 0)} −${sf.reduce((x, f) => x + f.del, 0)}` : '';
      cntUnstaged.textContent = uf.length ? `${uf.length} · +${uf.reduce((x, f) => x + f.add, 0)} −${uf.reduce((x, f) => x + f.del, 0)}` : '';
    }

    function rerender() {
      if (!lastData) return;
      const sf = parseFiles(filterDiff(lastData.staged, currentFilter));
      const uf = parseFiles(filterDiff(lastData.unstaged, currentFilter));
      document.getElementById('sec-staged').style.display = sf.length ? '' : 'none';
      renderSection('staged', sf, treeStaged);
      renderSection('unstaged', uf, treeUnstaged);
      updateStats(sf, uf);
    }

    async function refresh() {
      try {
        const r = await fetch('api/diff', { cache: 'no-store' });
        const data = await r.json();
        const s = data.staged + '\x00' + data.unstaged;
        if (s === lastSig) return;
        lastSig = s; lastData = data;
        const sbTop = document.getElementById('sidebar').scrollTop;
        rerender();
        document.getElementById('sidebar').scrollTop = sbTop;
        stamp.textContent = 'updated ' + new Date().toLocaleTimeString();        // live-refresh the open file if it still exists on its side
        if (currentPath && currentSide) {
          const list = parseFiles(data[currentSide]);
          if (list.some(f => f.path === currentPath)) {
            try {
              const r2 = await fetch('api/file?path=' + encodeURIComponent(currentPath) + '&side=' + currentSide, { cache: 'no-store' });
              const d2 = await r2.json();
              if (!d2.binary) {
                const ns = sig(d2.before) + ':' + sig(d2.after);
                if (ns !== currentSig) {
                  const mono = await loadMonaco(); ensureEditor(mono);
                  if (currentModels) { currentModels.original.dispose(); currentModels.modified.dispose(); }
                  currentModels = {
                    original: mono.editor.createModel(d2.before || '', d2.language),
                    modified: mono.editor.createModel(d2.after || '', d2.language),
                  };
                  diffEditor.setModel(currentModels); currentSig = ns;
                }
              }
            } catch (e) {}
          } else {
            if (currentModels) { currentModels.original.dispose(); currentModels.modified.dispose(); currentModels = null; }
            if (diffEditor) diffEditor.setModel({ original: null, modified: null });
            currentPath = null; currentSide = null; currentSig = '';
            showOverlay('File no longer changed.');
          }
        }
      } catch (e) { liveTxt.textContent = 'error'; }
      // live-refresh the raw file view too, if open
      if (rawPath) {
        try {
          const rr = await fetch('api/raw?path=' + encodeURIComponent(rawPath), { cache: 'no-store' });
          const dd = await rr.json();
          const m = rawModels.get(rawPath);
          if (m && dd.content != null && m.getValue() !== dd.content) m.setValue(dd.content);
        } catch (e) {}
      }
    }

    /* ---------------- events ---------------- */
    let ft = null;
    filterInput.addEventListener('input', () => {
      currentFilter = filterInput.value.trim();
      clearTimeout(ft); ft = setTimeout(rerender, 120);
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement !== filterInput) { e.preventDefault(); filterInput.focus(); }
      if (e.key === 'Escape' && document.activeElement === filterInput) { filterInput.value = ''; currentFilter = ''; rerender(); filterInput.blur(); }
    });
    // section collapse (head click) + collapse-folders (acts)
    document.querySelectorAll('.section-head').forEach(h => h.addEventListener('click', (e) => {
      if (e.target.closest('.acts')) return;
      h.parentElement.classList.toggle('collapsed');
    }));
    document.querySelectorAll('.section .fold-all').forEach(a => a.addEventListener('click', (e) => {
      e.stopPropagation();
      const sec = a.closest('.section'); const folders = sec.querySelectorAll('.folder');
      const anyOpen = [...folders].some(d => d.open);
      folders.forEach(d => d.open = !anyOpen);
      a.textContent = anyOpen ? 'expand' : 'collapse';
    }));

    const es = new EventSource('api/watch');
    es.addEventListener('hello', () => { liveEl.classList.add('on'); liveTxt.textContent = 'live'; refresh(); loadHistory(); });
    es.addEventListener('open', () => { liveEl.classList.add('on'); liveTxt.textContent = 'live'; });
    es.addEventListener('changed', () => { refresh(); loadHistory(); }); // server caches /api/commits until HEAD moves
    es.addEventListener('error', () => { liveEl.classList.remove('on'); liveTxt.textContent = 'reconnecting…'; });

    // Dynamic title from the server (repo name).
    fetch('api/config').then(r => r.json()).then(c => {
      const n = c.name || 'live-diff';
      document.getElementById('repo-name').textContent = n;
      document.title = n + ' · live-diff';
    }).catch(() => {});

    loadMonaco();
    refresh();
    loadHistory();
  </script>
</body>
</html>
